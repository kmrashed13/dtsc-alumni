
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d39">

  <title>Alumni Directory | DTSC Alumni Association</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="directory.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <main class="directory-container">

    <!-- DIRECTORY HEADER -->
    <section class="directory-header">

      <div class="directory-logo">
        <img
          src="../logo.png"
          alt="DTSC Logo"
          onerror="this.style.display='none'"
        >
      </div>

      <div class="directory-welcome">
        <h2>Welcome to DTSC</h2>
        <p>Registered Alumni List</p>
      </div>

      <a href="../index.html" class="back-home">
        <span>←</span> Back to Home
      </a>

    </section>


    <!-- SEARCH AND FILTER SECTION -->
    <section class="directory-search-section">

      <h2 class="search-heading">
        <span class="search-heading-icon">⌕</span>
        Find a DTSCian
      </h2>

      <!-- SEARCH -->
      <div class="search-row">

        <input
          type="search"
          id="alumniSearch"
          placeholder="Name / ID / Upazila / District / Contact..."
          autocomplete="off"
        >

        <button type="button" id="searchBtn" class="search-button">
          Search
        </button>

      </div>


      <!-- FILTERS -->
      <div class="directory-filters">

        <div class="filter-group">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Student">Student</option>
            <option value="Teacher">Teacher</option>
          </select>
        </div>


        <div class="filter-group">
          <label for="examFilter">Last Exam</label>
          <select id="examFilter">
            <option value="">All Exams</option>
            <option value="Junior School Certificate">Junior School Certificate</option>
            <option value="Secondary School Certificate">Secondary School Certificate</option>
            <option value="Higher Secondary Certificate">Higher Secondary Certificate</option>
            <option value="Diploma in Engineering">Diploma in Engineering</option>
          </select>
        </div>


        <div class="filter-group">
          <label for="tradeFilter">Trade / Technology</label>
          <select id="tradeFilter">
            <option value="">All Trades</option>
            <option value="General Electrical Works">General Electrical Works</option>
            <option value="Refrigeration And Air Conditions">Refrigeration And Air Conditions</option>
            <option value="Machine Tools Operation">Machine Tools Operation</option>
            <option value="Firm Machinery">Firm Machinery</option>
            <option value="21 - Agro Machinery">21 - Agro Machinery</option>
            <option value="27 - Electrical Works and Maintenance">27 - Electrical Works and Maintenance</option>
            <option value="30 - Machine Tools Operation and Maintenance">30 - Machine Tools Operation and Maintenance</option>
            <option value="32 - Refrigeration and Air-conditioning">32 - Refrigeration and Air-conditioning</option>
            <option value="67 - Electrical Technology">67 - Electrical Technology</option>
            <option value="70 - Mechanical Technology">70 - Mechanical Technology</option>
          </select>
        </div>


        <div class="filter-group">
          <label for="yearFilter">Passing Year</label>
          <select id="yearFilter">
            <option value="">All Years</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
          </select>
        </div>


        <div class="filter-group">
          <label for="bloodFilter">Blood Group</label>
          <select id="bloodFilter">
            <option value="">All Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>


        <div class="filter-group">
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="Verified">Verified</option>
            <option value="Pending">Pending</option>
          </select>
        </div>

      </div>


      <!-- RESET -->
      <div class="filter-actions">
        <button type="button" id="resetBtn" class="reset-button">
          ↺ Reset Filters
        </button>
      </div>

    </section>


    <!-- RESULT HEADER -->
    <section class="result-header">

      <h3>Alumni Found</h3>

      <span class="result-count">
        <strong id="resultCount">0</strong> Members
      </span>

    </section>


    <!-- ALUMNI RESULTS -->
    <section id="memberList" class="member-list" aria-live="polite">
      <!-- JavaScript will load members here -->
    </section>


    <div class="directory-note">
      DTSC Alumni Association
    </div>

  </main>


  <script src="directory.js"></script>

</body>
</html>
