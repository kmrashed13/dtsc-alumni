
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b35">

  <title>Membership Directory | DTSC Alumni Association</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./directory.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <!-- GLOBAL HEADER -->
  <div id="global-header"></div>

  <main class="directory-page">
    <div class="directory-container">

      <!-- TOP ACTIONS -->
      <div class="directory-action-bar">
        <a href="../index.html" class="back-home">
          <i class="fas fa-arrow-left"></i>
          Back to Home
        </a>

        <a href="../register/index.html" class="add-profile">
          <i class="fas fa-plus"></i>
          Add Your Profile
        </a>
      </div>

      <!-- DIRECTORY BRAND -->
      <header class="directory-brand">

        <div class="brand-side-logo">
          <img src="../assets/logo.png" alt="Association Logo">
        </div>

        <div class="brand-center">
          <h1>DTSC ALUMNI</h1>
          <p>ALUMNI DIRECTORY</p>
        </div>

        <div class="brand-side-logo">
          <img src="../assets/dtsclogo.png" alt="DTSC Logo">
        </div>

      </header>

      <!-- SEARCH PANEL -->
      <section class="search-panel">

        <div class="search-panel-heading">
          <h2><i class="fas fa-search"></i> Search Alumni</h2>
          <p>Find alumni by name, ID, location or contact number.</p>
        </div>

        <div class="search-input-wrap">
          <i class="fas fa-search"></i>

          <input
            type="search"
            id="searchInput"
            placeholder="Search Name / ID / Thana / District / Division / Contact No"
            autocomplete="off"
          >

          <button type="button" id="clearSearch" aria-label="Clear Search">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <!-- FILTERS -->
        <div class="directory-filters">

          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="STUDENT">Student</option>
            <option value="TEACHER">Teacher</option>
          </select>

          <select id="examFilter">
            <option value="">All Exams</option>
            <option value="SSC">SSC</option>
            <option value="DIPLOMA">Diploma</option>
            <option value="HSC">HSC</option>
            <option value="BSC">BSc</option>
          </select>

          <select id="tradeFilter">
            <option value="">All Trades / Technologies</option>
            <option value="General Electrical Works">General Electrical Works</option>
            <option value="Refrigeration And Air Conditions">Refrigeration And Air Conditions</option>
            <option value="Machine Tools Operation">Machine Tools Operation</option>
            <option value="Firm Machinery">Firm Machinery</option>
            <option value="Agro Machinery">Agro Machinery</option>
            <option value="Electrical Works and Maintenance">Electrical Works and Maintenance</option>
            <option value="Machine Tools Operation and Maintenance">Machine Tools Operation and Maintenance</option>
          </select>

          <select id="yearFilter">
            <option value="">All Passing Years</option>
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
          </select>

          <select id="bloodFilter">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>

          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="PENDING">Pending</option>
            <option value="VERIFIED">Verified</option>
          </select>

        </div>

        <!-- BUTTONS -->
        <div class="search-actions">

          <button type="button" id="searchBtn" class="search-submit">
            <i class="fas fa-search"></i>
            Search Alumni
          </button>

          <button type="button" id="resetBtn" class="reset-filters">
            <i class="fas fa-rotate-left"></i>
            Reset Filters
          </button>

        </div>

      </section>

      <!-- RESULTS -->
      <section class="directory-results">

        <div class="results-heading">

          <div>
            <h2>Alumni Members</h2>
            <p>Explore our DTSCian community members.</p>
          </div>

          <div class="members-found" id="resultsCount">
            <strong>0</strong>
            <span>Members Found</span>
          </div>

        </div>

        <div class="member-list" id="memberList"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
          <i class="fas fa-user-slash"></i>
          <h3>No Alumni Found</h3>
          <p>Try changing your search or filters.</p>
        </div>

      </section>

    </div>
  </main>

  <!-- PROFILE MODAL -->
  <div class="profile-modal" id="profileModal">

    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-box">

      <div class="modal-header">
        <h3><i class="fas fa-id-card"></i> Alumni Profile</h3>

        <button type="button" id="closeModal" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">

        <img id="profilePhoto" class="modal-photo" src="" alt="Member Photo">

        <h2 id="profileName"></h2>
        <p id="profileId" class="modal-member-id"></p>

        <div id="profileBadges" class="modal-badges"></div>

        <div id="profileDetails" class="profile-details"></div>

      </div>

    </div>
  </div>

  <!-- GLOBAL FOOTER -->
  <div id="global-footer"></div>

  <script src="../header-loader.js"></script>
  <script src="./directory.js"></script>

</body>
</html>
