<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d36">

  <title>DTSC Alumni Directory</title>

  <link rel="stylesheet" href="directory.css">
</head>

<body>

  <!-- TOP NAVIGATION BAR -->
  <nav class="top-nav">
    <div class="top-nav-container">
      <a href="../index.html" class="nav-btn back-btn">
        &larr; Back to Home
      </a>
      <a href="../register.html" class="nav-btn add-btn">
        + Add Your Profile
      </a>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="directory-header">
    <div class="header-content">

      <img src="../assets/logo.png" alt="DTSC Alumni Logo">

      <div class="header-title">
        <span class="header-label">DTSCIAN COMMUNITY</span>
        <h1>DTSC ALUMNI DIRECTORY</h1>
        <p>
          Find for reconnect with lost batchmates, reach out to respected
          teachers, and build lifelong bonds within our DTSCian family.
        </p>
      </div>

      <img src="../assets/dtsclogo.png" alt="DTSC Institute Logo">

    </div>
  </header>


  <!-- MAIN CONTAINER -->
  <main class="directory-container">

    <!-- SEARCH PANEL -->
    <section class="search-panel">

      <div class="section-heading">
        <div>
          <h2>Find Alumni</h2>
          <p>Search and connect with DTSC students and teachers.</p>
        </div>

        <div class="search-icon">⌕</div>
      </div>


      <!-- SEARCH INPUT -->
      <div class="search-box">
        <span class="search-symbol">⌕</span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search by name, Alumni ID, division, district, upazila or contact..."
          autocomplete="off"
        >
      </div>


      <!-- FILTER HEADING -->
      <div class="filter-heading">
        <span>FILTER MEMBERS</span>
        <div class="filter-line"></div>
      </div>


      <!-- FILTER GRID -->
      <div class="filter-grid">

        <div class="filter-item">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="STUDENT">Student</option>
            <option value="TEACHER">Teacher</option>
          </select>
        </div>


        <div class="filter-item">
          <label for="examFilter">Last Exam</label>
          <select id="examFilter">
            <option value="">All Exams</option>
            <option value="Junior School Certificate">Junior School Certificate</option>
            <option value="Secondary School Certificate">Secondary School Certificate</option>
            <option value="Higher Secondary Certificate">Higher Secondary Certificate</option>
            <option value="Diploma in Engineering">Diploma in Engineering</option>
          </select>
        </div>


        <div class="filter-item">
          <label for="tradeFilter">Trade / Technology</label>
          <select id="tradeFilter">
            <option value="">All Trades / Technologies</option>
            <option value="General Electrical Works">General Electrical Works</option>
            <option value="Refrigeration And Air Conditions
