<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101d35">
<title>Administration Login | DTSC Alumni</title>
<link rel="stylesheet" href="./login.css">
</head>

<body class="admin-page">

<div class="login-container">

  <header class="login-header">
    <div class="portal-icon">♙</div>
    <h2>Administration Portal</h2>
    <p>DTSC ALUMNI ASSOCIATION</p>
  </header>

  <main class="login-form-area">

    <h3>Administrator Sign In</h3>

    <form id="adminLoginForm">

      <label for="email">Official Email Address</label>
      <input type="email" id="email"
        placeholder="Enter official email" required>

      <label for="password">Password</label>
      <input type="password" id="password"
        placeholder="Enter your password" required>

      <button type="submit" class="login-submit" id="loginBtn">
        SECURE ADMIN LOGIN →
      </button>

      <p id="loginMessage"></p>

    </form>

    <div class="notice">
      Restricted Access<br>
      Authorized Personnel Only
    </div>

    <div class="back-navigation">
      <a href="../index.html">⌂ Back to Home</a>
      <a href="../index.html?openLogin=true">← Back to Login Portal</a>
    </div>

  </main>

  <footer class="login-footer">
    © 2026 DTSC Alumni Association
  </footer>

</div>

<script src="./login.js"></script>
</body>
</html>
