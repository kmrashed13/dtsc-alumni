
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration Login | DTSC Alumni</title>
<link rel="stylesheet" href="login.css">
<style>
body{background:#eef0f4}
.login-container{border-top:5px solid #c6a65d}
.login-container h2{color:#172943}
button{background:linear-gradient(135deg,#d9bd78,#c6a65d);color:#172943}
button:hover{background:#c6a65d}
</style>
</head>
<body>
<div class="login-container">
<h2>♙ Administration Portal</h2>
<p>DTSC ALUMNI ASSOCIATION</p>

<form id="adminLoginForm">
<label>Official Email Address</label>
<input type="email" id="email" placeholder="Enter official email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<button type="submit" id="loginBtn">SECURE ADMIN LOGIN →</button>
<p id="loginMessage"></p>
</form>

<p class="notice">Restricted Access · Authorized Personnel Only</p>

<div class="back-links">
<a href="../index.html">← Back to Home</a>
<a href="../index.html?openLogin=true">← Back to Login Portal</a>
</div>
</div>
</body>
</html>
