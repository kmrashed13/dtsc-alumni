<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login | DTSC Alumni</title>
<link rel="stylesheet" href="login.css">
<style>
body{background:#f1f3f8}
.login-container{border-top:5px solid #294d78}
.login-container h2{color:#203e64}
button{background:#203e64;color:white}
button:hover{background:#142c4b}
</style>
</head>
<body>
<div class="login-container">
<h2>📖 Teacher Portal</h2>
<p>A RESPECTED PLACE FOR OUR EDUCATORS</p>

<form id="teacherLoginForm">
<label>Official Email Address</label>
<input type="email" id="email" placeholder="Enter official email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<p><a href="#" id="forgotPassword">Forgot Password?</a></p>

<button type="submit" id="loginBtn">SIGN IN AS HONORABLE TEACHERS →</button>
<p id="loginMessage"></p>
</form>

<p>Not Registered? <a href="../register/teacher/teacher.html">Register Now</a></p>

<div class="back-links">
<a href="../index.html">← Back to Home</a>
<a href="../index.html?openLogin=true">← Back to Login Portal</a>
</div>
</div>
</body>
</html>
