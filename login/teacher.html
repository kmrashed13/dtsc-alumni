
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#152d50">
<title>Teacher Login | DTSC Alumni</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f1f3f7}
.card{width:100%;max-width:390px;background:white;border-radius:17px;overflow:hidden;box-shadow:0 15px 40px #152d5020}
.header{background:linear-gradient(135deg,#152d50,#315982);padding:32px 20px;text-align:center;color:white}
.icon{font-size:34px;margin-bottom:12px}
.header h2{font-size:22px;color:white}
.header p{font-size:11px;color:#d6e1ef;margin-top:7px;letter-spacing:1px}
.form-area{padding:28px 27px}
.form-area h3{text-align:center;color:#192f4d;font-size:19px;margin-bottom:24px}
.field{margin-bottom:17px}
label{display:block;font-size:12px;font-weight:600;color:#46556b;margin-bottom:8px}
input{width:100%;height:46px;padding:0 13px;border:1px solid #dce2eb;border-radius:8px;background:#fafbfc;outline:none;font-size:13px}
input:focus{border-color:#315982;box-shadow:0 0 0 3px #31598215}
.login-btn{width:100%;height:47px;border:0;border-radius:8px;background:#203e64;color:white;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;margin-top:5px}
.login-btn:hover{background:#142c4b}
.back-links{display:flex;flex-direction:column;gap:9px;margin-top:19px}
.back-links a{display:flex;align-items:center;justify-content:center;min-height:40px;border:1px solid #dce2eb;border-radius:8px;background:#f5f7fa;color:#263e5c;font-size:12px;font-weight:600;text-decoration:none;transition:.25s}
.back-links a:hover{background:#203e64;color:white;border-color:#203e64;transform:translateY(-2px)}
.footer{text-align:center;padding:13px;background:#f8f9fb;color:#929baa;font-size:10px;border-top:1px solid #edf0f4}
</style>
</head>

<body>
<div class="card">

<div class="header">
<div class="icon">📖</div>
<h2>Teacher Portal</h2>
<p>A RESPECTED PLACE FOR OUR EDUCATORS</p>
</div>

<div class="form-area">
<h3>Sign In as Honorable Teachers</h3>

<form id="teacherLoginForm">
<div class="field">
<label for="email">Official Email Address</label>
<input type="email" id="email" placeholder="Enter official email" required>
</div>

<div class="field">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password" required>
</div>

<button type="submit" class="login-btn">
SIGN IN AS HONORABLE TEACHERS →
</button>
</form>

<div class="back-links">
<a href="../index.html">← Back to Home</a>
<a href="./index.html">← Back to Login Portal</a>
</div>

</div>

<div class="footer">
© 2026 DTSC Alumni Association. All Rights Reserved.
</div>

</div>

<script>
document.getElementById("teacherLoginForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Teacher authentication is not connected yet.");
});
</script>
</body>
</html>
