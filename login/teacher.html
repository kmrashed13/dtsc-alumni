<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#152d50">
<title>Teacher Login | DTSC Alumni</title>
<link rel="stylesheet" href="./login.css">
</head>

<body class="teacher-page">

<div class="login-container">

  <header class="login-header">
    <div class="portal-icon">📖</div>
    <h2>Teacher Portal</h2>
    <p>A RESPECTED PLACE FOR OUR EDUCATORS</p>
  </header>

  <main class="login-form-area">

    <h3>Sign In as Honorable Teachers</h3>

    <form id="teacherLoginForm">

      <label for="email">Official Email Address</label>
      <input type="email" id="email"
        placeholder="Enter official email" required>

      <label for="password">Password</label>
      <input type="password" id="password"
        placeholder="Enter your password" required>

      <div class="forgot-row">
        <a href="#" id="forgotPassword">Forgot Password?</a>
      </div>

      <button type="submit" class="login-submit" id="loginBtn">
        SIGN IN AS HONORABLE TEACHERS →
      </button>

      <p id="loginMessage"></p>

    </form>

    <div class="register-row">
      Not Registered?
      <a href="../register/teacher/teacher.html">Register Now</a>
    </div>

    <div class="back-navigation">
      <a href="../index.html">⌂ Back to Home</a>
      <a href="../index.html?openLogin=true">← Back to Login Portal</a>
    </div>

  </main>

  <footer class="login-footer">
    © 2026 DTSC Alumni Association
  </footer>

</div>

</body>
</html>
