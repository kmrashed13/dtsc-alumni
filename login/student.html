
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123d30">
<title>Student Login | DTSC Alumni</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f1f4f2}
.card{width:100%;max-width:390px;background:white;border-radius:17px;overflow:hidden;box-shadow:0 15px 40px #173b3020}
.header{background:linear-gradient(135deg,#123d30,#267052);padding:32px 20px;text-align:center;color:white}
.icon{font-size:34px;margin-bottom:12px}
.header h2{font-size:22px;color:#fff}
.header p{font-size:11px;color:#d2e6dc;margin-top:7px;letter-spacing:1px}
.form-area{padding:28px 27px}
.form-area h3{text-align:center;color:#173d30;font-size:19px;margin-bottom:24px}
.field{margin-bottom:17px}
label{display:block;font-size:12px;font-weight:600;color:#43564c;margin-bottom:8px}
input{width:100%;height:46px;padding:0 13px;border:1px solid #dce5df;border-radius:8px;background:#fafcfb;outline:none;font-size:13px}
input:focus{border-color:#267052;box-shadow:0 0 0 3px #26705215}
.login-btn{width:100%;height:47px;border:0;border-radius:8px;background:#18533e;color:white;font-size:12px;font-weight:700;letter-spacing:.6px;cursor:pointer;margin-top:5px}
.login-btn:hover{background:#103b2d}
.back-links{display:flex;flex-direction:column;gap:9px;margin-top:19px}
.back-links a{display:flex;align-items:center;justify-content:center;min-height:40px;border:1px solid #dce5df;border-radius:8px;background:#f5f8f6;color:#244b3a;font-size:12px;font-weight:600;text-decoration:none;transition:.25s}
.back-links a:hover{background:#18533e;color:white;border-color:#18533e;transform:translateY(-2px)}
.footer{text-align:center;padding:13px;background:#f8faf9;color:#929e96;font-size:10px;border-top:1px solid #edf1ee}
</style>
</head>

<body>
<div class="card">

<div class="header">
<div class="icon">🎓</div>
<h2>Student Portal</h2>
<p>YOUR CONNECTION. YOUR COMMUNITY.</p>
</div>

<div class="form-area">
<h3>Sign In Student</h3>

<form id="studentLoginForm">
<div class="field">
<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>
</div>

<div class="field">
<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password" required>
</div>

<button type="submit" class="login-btn">
SIGN IN AS STUDENT →
</button>
</form>

<div class="back-links">
<a href="../index.html">← Back to Home</a>
<a href="./index.html">← Back to Login Portal</a>
</div>

</div>

<div class="footer">
© 2026 DTSC Alumni Association. All Rights Reserved.
</div>

</div>

<script>
document.getElementById("studentLoginForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Student authentication is not connected yet.");
});
</script>
</body>
</html>
