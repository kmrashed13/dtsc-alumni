
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10213e">

<title>DTSC ALUMNI DIRECTORY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="directory.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">

    <img
      class="header-logo"
      src="../assets/logo.png"
      alt="Organization Logo"
    >

    <div class="header-center">
      <h1>DTSC ALUMNI DIRECTORY</h1>

      <p>
        Find for reconnect with lost batchmates, reach out to respected teachers, and build lifelong bonds within our DTSCian family.
      </p>
    </div>

    <img
      class="header-logo"
      src="../assets/dtsclogo.png"
      alt="DTSC Logo"
    >

  </div>
</header>


<main class="container">

  <!-- SEARCH SECTION -->
  <section class="search-panel">

    <h2 class="section-title">Find Alumni</h2>

    <div class="search-input">
      <label class="form-label" for="searchInput">
        Search Alumni
      </label>

      <input
        type="text"
        id="searchInput"
        placeholder="Name / Alumni ID / Division / District / Upazila / Contact..."
      >
    </div>

    <h3 class="filter-heading">Advanced Filters</h3>

    <div class="filter-grid">

      <div class="filter-item">
        <label class="form-label" for="memberType">Member Type</label>
        <select id="memberType">
          <option value="">All Member Types</option>
          <option value="Student">Student</option>
          <option value="Teacher">Honorable Teacher</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="lastExam">Last Exam</label>
        <select id="lastExam">
          <option value="">All Exams</option>
          <option value="Diploma">Diploma</option>
          <option value="SSC">SSC</option>
          <option value="HSC">HSC</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="trade">Trade</label>
        <select id="trade">
          <option value="">All Trades</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Electrical">Electrical</option>
          <option value="Civil">Civil</option>
          <option value="Computer">Computer</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="passingYear">Passing Year</label>
        <select id="passingYear">
          <option value="">All Years</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
          <option value="2020">2020</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="bloodGroup">Blood Group</label>
        <select id="bloodGroup">
          <option value="">All Blood Groups</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="form-label" for="membershipStatus">
          Membership Status
        </label>

        <select id="membershipStatus">
          <option value="">All Statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

    </div>

    <div class="button-row">

      <button class="btn btn-search" id="searchBtn">
        Search
      </button>

      <button class="btn btn-reset" id="resetBtn">
        Reset
      </button>

    </div>

  </section>


  <!-- SEARCH RESULTS -->
  <section class="results-section">

    <div class="results-top">

      <h2 class="section-title">Search Results</h2>

      <span class="results-count" id="resultsCount">
        0 Members Found
      </span>

    </div>

    <div class="member-list" id="memberList"></div>

  </section>

</main>


<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">

  <div class="modal-content">

    <button class="close-modal" id="closeModal" aria-label="Close">
      &times;
    </button>

    <div class="profile-heading">

      <div class="member-photo" id="profilePhoto">
        👤
      </div>

      <h2 id="profileName">Member Name</h2>

      <p class="member-id" id="profileId"></p>

      <div class="profile-badges" id="profileBadges"></div>

    </div>

    <div class="profile-details" id="profileDetails"></div>

  </div>

</div>


<footer class="footer">
  DTSC ALUMNI DIRECTORY &copy; 2026
</footer>


<script src="directory.js"></script>

</body>
</html>
